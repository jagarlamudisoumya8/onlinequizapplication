<article class="course-card h-100">
  <img src="{{ course.image_url }}" alt="{{ course.title }}">
  <div class="p-3">
    <div class="d-flex justify-content-between align-items-center mb-2"><span class="pill">{{ course.level|title }}</span><span class="small text-muted">{{ course.quiz_count|default:course.quizzes.count }} quizzes</span></div>
    <h5>{{ course.title }}</h5>
    <p>{{ course.description|truncatewords:18 }}</p>
    <a class="btn btn-outline-primary w-100" href="{{ course.get_absolute_url }}">View Course</a>
  </div>
</article>
